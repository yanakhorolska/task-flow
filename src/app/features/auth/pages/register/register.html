<main class="auth-page">
  <section class="visual-panel" aria-hidden="true">
    <a class="brand" routerLink="/tasks">❧ <span>TaskFlow</span></a>

    <div class="illustration">
      <div class="window">
        <span class="sun"></span>
        <span class="hill hill-one"></span>
        <span class="hill hill-two"></span>
      </div>

      <div class="desk">
        <span class="plant">☘</span>
        <span class="laptop">✎</span>
        <span class="mug">☕</span>
      </div>

      <div class="cat">⌁</div>
    </div>

    <div class="visual-copy">
      <span class="kicker">Build your rhythm</span>
      <h1>Make space for what matters.</h1>
      <p>Create a calm home for your tasks and shape a routine that works for you.</p>
    </div>
  </section>

  <section class="form-panel">
    <div class="form-wrap">
      <a class="mobile-brand" routerLink="/tasks">❧ TaskFlow</a>

      <header>
        <span class="kicker">Start fresh</span>
        <h2>Create your account</h2>
        <p>Your cozy productivity space is one step away.</p>
      </header>

      <form>
        <label>
          <span>Name</span>
          <input type="text" placeholder="Yana" autocomplete="name" />
        </label>

        <label>
          <span>Email</span>
          <input type="email" placeholder="yana@example.com" autocomplete="email" />
        </label>

        <label>
          <span>Password</span>
          <input type="password" placeholder="••••••••" autocomplete="new-password" />
        </label>

        <label class="terms">
          <input type="checkbox" />
          <span>I agree to the Terms of Service and Privacy Policy.</span>
        </label>

        <button class="primary-button" type="button">Create account</button>

        <div class="divider"><span>or continue with</span></div>

        <div class="social-actions">
          <button type="button">G&nbsp;&nbsp; Google</button>
          <button type="button">●&nbsp;&nbsp; GitHub</button>
        </div>
      </form>

      <p class="switch-copy">
        Already have an account?
        <a routerLink="/login">Sign in</a>
      </p>
    </div>
  </section>
</main>
