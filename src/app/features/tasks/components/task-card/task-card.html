<article>
  <a [routerLink]="['/tasks', task.id]"> View </a>
  <h2>{{ task.title }}</h2>

  <p>{{ task.description }}</p>

  <p>Status: {{ task.status }}</p>
  <p>Priority: {{ task.priority }}</p>
  <p>Due date: {{ task.dueDate | date: 'dd MMM yyyy' }}</p>

  <button type="button" (click)="onDelete()">Delete</button>
</article>
