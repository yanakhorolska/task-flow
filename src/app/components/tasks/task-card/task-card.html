<article class="task-card">
  <div class="task-main">
    <div class="task-title-row">
      <h3>{{ task.title }}</h3>
      <span class="status" [attr.data-status]="task.status">{{ task.status }}</span>
    </div>

    <p>{{ task.description }}</p>

    <div class="meta">
      <span class="priority" [attr.data-priority]="task.priority">
        {{ task.priority }} priority
      </span>
      <span>Due {{ task.dueDate | date: 'dd MMM yyyy' }}</span>
    </div>
  </div>

  <a class="details-link" [routerLink]="['/tasks', task.id]">View details →</a>
</article>
