<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/profile" aria-label="TaskFlow home">
      <span class="brand-mark">❧</span>
      <span>TaskFlow</span>
    </a>

    <nav class="nav" aria-label="Main navigation">
      <span class="nav-label">Workspace</span>
      <a routerLink="/profile" routerLinkActive="active"><span class="nav-icon">☺</span> My profile</a>

      <a routerLink="/tasks" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <span class="nav-icon">☷</span>
        My tasks
      </a>

      <a routerLink="/tasks/new" routerLinkActive="active">
        <span class="nav-icon">＋</span>
        New task
      </a>





      <a routerLink="/goals" routerLinkActive="active">
        <span class="nav-icon">◎</span>
        Goals
      </a>

      <a routerLink="/wishlist" routerLinkActive="active">
        <span class="nav-icon">♡</span>
        Wishlist
      </a>
    </nav>

    <div class="sidebar-footer">
      <button class="logout-button" type="button" (click)="logout()">Sign out</button>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-copy">
        <span class="eyebrow">Your cozy workspace</span>
        <strong>Organize today, breathe easier tomorrow.</strong>
      </div>

      <div class="topbar-actions">
        <button class="theme-preview" type="button" aria-label="Theme settings preview" disabled>
          ☼
        </button>
        <a class="avatar" routerLink="/profile" aria-label="My profile">{{ auth.currentUser()?.name?.charAt(0)?.toUpperCase() || "☺" }}</a>
      </div>
    </header>

    <section class="page">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
